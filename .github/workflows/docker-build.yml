name: Build and Push Docker image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository }}
  DH_REGISTRY: docker.io
  DH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/javsp

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          # 新的 vX.X.X 标签支持任意主版本，兼容历史四段版本；手动触发仅生成 dev 镜像
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
            VERSION="${VERSION#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+([.][0-9]+)?$ ]]; then
              echo "Invalid stable version tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0.0")"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DH_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.DH_REGISTRY }}/${{ env.DH_IMAGE }}
          flavor: latest=false
          tags: |
            type=match,pattern=^v([0-9]+[.][0-9]+[.][0-9]+([.][0-9]+)?)$,group=1,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=JavSP
            org.opencontainers.image.description=AV metadata scraper
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build once and push to both registries
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up old ghcr.io images
        run: |
          OWNER="${{ github.repository_owner }}"
          PKG="javsp"
          UNTAGGED=$(gh api --paginate "users/$OWNER/packages/container/$PKG/versions" \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id')
          if [ -z "$UNTAGGED" ]; then
            echo "No untagged versions to clean up"
            exit 0
          fi
          for ver in $UNTAGGED; do
            echo "Deleting untagged version: $ver"
            gh api --method DELETE "users/$OWNER/packages/container/$PKG/versions/$ver" || true
          done
          echo "Cleanup complete"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
